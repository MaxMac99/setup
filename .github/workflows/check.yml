name: Check Nix Configuration

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Check formatting
        run: nix fmt -- --check .

      - name: nix flake check
        run: nix flake check --all-systems

      - name: Dry-run build darwin configs
        run: |
          nix build .#darwinConfigurations.Maxs-MacBook-Pro.system --dry-run
          nix build .#darwinConfigurations.kopf3-NB-26.system --dry-run

      - name: Dry-run build NixOS configs
        run: |
          nix build .#nixosConfigurations.maxdata.config.system.build.toplevel --dry-run
          nix build .#nixosConfigurations.ionos.config.system.build.toplevel --dry-run
          nix build .#nixosConfigurations.brink-server.config.system.build.toplevel --dry-run
          nix build .#nixosConfigurations.winkel-pi.config.system.build.toplevel --dry-run

      # A real build, not a dry run: homelab-k8s pins a rev of this repo and
      # the T3 Code pod builds these on start, so a broken rev must fail here.
      - name: Build opencode packages for the T3 Code pod
        run: |
          nix build .#opencode-config .#meridian
          jq -e '.provider.anthropic.options.baseURL == "http://127.0.0.1:3456/v1"' result/opencode.json
          test -f result/skills/plan/SKILL.md