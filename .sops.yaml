  # ionos's age source, and k3s_token stops decrypting at boot without it.
  - &ionos age100thyt62mn4gyw90thmz5rzqtzd5d9jga4gtljvylcnuu3cawscqcqtmah
  # Transitional, added 2026-08-06 (Phase 3.0). Derived from ionos's
  # /etc/ssh/ssh_host_ed25519_key, and deliberately enrolled *alongside*
  # &ionos rather than replacing it: adding a recipient is additive and cannot
  # break a running host, whereas flipping age.sshKeyPaths is what actually
  # risks k3s_token at boot. Both files can now be decrypted by either key, so
  # the flip is a config change with a working fallback rather than a flag day.
  # &ionos and this comment pair go away once the flip is verified.
  - &ionos-host age19ylfvg7p6zw67t7dkutrj4d0dg5wllnf8ltwjzdlttuu33wt69ssv0mxlm
  - &k3s-node1 age10jf99q3ygydry992384x0sc6qh4l7auvyun92arvsm2mm5lttvwqf2z3t3
