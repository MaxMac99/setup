  # only the host-side `sops` block was missing.
  - &winkel-pi age1acjwunaejf345typ42284yxlreqqp39ndcfjqvcf8frsawwntf6sq3u23k
  # Derived from /etc/ssh/ssh_host_ed25519_key — a *host* key, per D11/2b.2,
  # unlike maxdata and ionos which still derive from a user key.
  - &brink-server age1pqhavyh47c882zd3h20a8q0mng5kdm5qsz7d4f2vayrjfndcsyxq4m7d3a
creation_rules:
  - path_regex: secrets/common.yaml
    key_groups:
      - age:
        - *maxs-macbook-pro
        - *kopf3-NB-26
        - *maxdata
        - *maxdata-host
        - *ionos
        - *ionos-host
        - *brink-server
        - *winkel-pi
  - path_regex: secrets/k3s.yaml
    key_groups:
      - age:
          - *maxs-macbook-pro
          - *maxdata
          - *maxdata-host
          - *ionos
          - *ionos-host
          - *k3s-node1
          - *k3s-node2
          - *k3s-node3
          - *winkel-pi
