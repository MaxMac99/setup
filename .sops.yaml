keys:
  - &maxs-macbook-pro age1crme8auc0sjgeu0r85w5lt04ey59me7jx4945zje4lnj3ctf2pzs8tc288
  - &kopf3-NB-26 age13242rt3uhlc6k7p6un8lxy86m3wysjclwntwr8v5pl9fshdf8suqxvqps2
  # ⚠️ A *user* key, /home/max/.ssh/id_ed25519. Kept only until the host key
  # below is proven on the box; nothing consumes it, because maxdata had no
  # sops block at all until Phase 3.
  - &maxdata age1s44mfk6jem5nz0nnt0kp0l59tdhzns0s6dtt97gwxf7xyxh2240sj5mw4m
  # Derived from maxdata's /etc/ssh/ssh_host_ed25519_key — a **host** key
  # (D11/2b.2). Added alongside rather than replacing: Phase 6.1 calls maxdata's
  # sops wiring the single highest-risk item in the migration, because the
  # microVM k3s token becomes undecryptable if it is got wrong, so the old
  # recipient stays until a decrypt has actually run on the box.
  - &maxdata-host age1ewxtypj7pkugz8vnf4pxtkgrnma8eg66p5shsq58kwdsku55vutsr2n2u7
  # ⚠️ A *user* key, /home/max/.ssh/id_ed25519 (ionos/default.nix:131) — the
